<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 372" width="850" height="372" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Cost per round versus requests in the batch</title>
<desc id="desc">Line chart. Batch size 1 to 4 on the x axis, milliseconds on the y axis. A speculative decoding round costs 21.9 ms at batch 1 and 30.3 ms at batch 4 (2.80 ms per extra request); with the PR 7 post-p/q graph 21.0 to 26.6 ms (1.93 per request); an ordinary decode step costs 11.5 to 12.8 ms (0.48 per request).</desc>
<text x="24" y="26" font-size="15" font-weight="600" fill="#e6edf3">Per-round cost grows ~6× faster with batch size than an ordinary decode step</text>
<text x="24" y="44" font-size="11.5" fill="#8b949e">Least-squares decomposition of 72 / 14 / 72 timed generate() calls by VERIFY-graph replay counters · RTX 5090 · Qwen3-8B target, Qwen3-0.6B draft · k=3</text>
