<text x="74" y="166.6" font-size="11" text-anchor="end" fill="#8b949e">20 ms</text>
<line x1="80" y1="92.9" x2="556" y2="92.9" stroke="#30363d" stroke-width="1"/>
<text x="74" y="96.9" font-size="11" text-anchor="end" fill="#8b949e">30 ms</text>
<text x="96" y="324" font-size="11.5" text-anchor="middle" fill="#8b949e">batch = 1</text>
<text x="244" y="324" font-size="11.5" text-anchor="middle" fill="#8b949e">batch = 2</text>
