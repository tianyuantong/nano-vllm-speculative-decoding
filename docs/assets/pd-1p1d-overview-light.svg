<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 445' width='760' height='445' role='img'><title>Dual-GPU 1P+1D disaggregation vs 1-GPU scheduling</title><desc>Left panel (whole-run ITL p99 ratio vs 1-GPU default, lower is better): at 8, 32, 64 concurrent requests, 1-GPU round-robin DSpark reaches 1.00×, 0.72×, 0.61×; 2-GPU 1P+1D DSpark reaches 0.31×, 0.24×, 0.31×; 2-GPU 1P+1D plain decoding reaches 0.15×, 0.19×, 0.16×. Right panel (steady-state throughput ratio vs 1-GPU default, higher is better): at 1, 8, 32, 64 concurrent requests, 2-GPU 1P+1D plain decoding reaches 1.00×, 1.10×, 1.35×, 1.52×; 2-GPU 1P+1D DSpark reaches 0.98×, 1.22×, 1.38×, 1.39×.</desc>
