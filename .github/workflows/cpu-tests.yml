name: cpu-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only dependencies
        # flash-attn and triton are GPU-only; the CPU suites replace them with test doubles.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.51" xxhash numpy pytest

      - name: Control-flow and reference checks
        run: python tools/run_cpu_tests.py

      - name: Sampler and regression checks
        run: python -m pytest -q tests/perf_repair
